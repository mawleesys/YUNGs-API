name: Build NeoForge

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build NeoForge jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build NeoForge
        run: ./gradlew :NeoForge:build --stacktrace --no-daemon

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: YungsApi-1.21.1-NeoForge-5.1.9+leakfix
          path: |
            NeoForge/build/libs/YungsApi-1.21.1-NeoForge-5.1.9+leakfix.jar
          if-no-files-found: error
